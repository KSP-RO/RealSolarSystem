@RealAntennasCommNetParams:FOR[RealSolarSystem]
{
    %HomeNodeTypes
    {
        %DSN = DSS 14 - Goldstone;DSS 43 - Canberra;DSS 63 - Madrid
        %NIP = NIP 4 - Yeniseisk;NIP 6 - Vulkanny
        %MSFN = MSFN - BDA Bermuda;MSFN - Grand Canary;MSFN - Guaymas;MSFN - IOS Indian Ocean;MSFN - Kano;MSFN - Kauai;MSFN - POS Pacific Ocean;SGLT 6 - GRGT Guam;WAL - USN Weilheim
        %STDN = STDN - Ascension;STDN - Carnarvon;STDN - Johannesburg;STDN - Quito;STDN - Tananarive
        %NEN = AGO 4 - SSC Santiago;AS3 - ASF Fairbanks;AUWA01 - USN South Point;DON - USN Dongara;KSAT - Svalbard;KSAT - Troll Station;MGS - McMurdo
        %ESTRACK = DSA 1 - New Norcia;DSA 3 - Malargüe;ESTRACK - Libreville;ESTRACK - Malindi;ESTRACK - Natal;ESTRACK - Redu;ESTRACK - Santa Maria;ESTRACK - Villafranca
    }
