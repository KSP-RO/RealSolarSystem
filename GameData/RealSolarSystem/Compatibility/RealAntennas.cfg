//  ================================================================================
//  Set up ground stations home nodes.
//  ================================================================================

@RealAntennasCommNetParams:FOR[RealSolarSystem]:NEEDS[RealAntennas]
{
    %HomeNodeTypes
    {
        %DSN = DSS 43 - Canberra;DSS 14 - Goldstone;DSS 63 - Madrid
        %NIP = NIP 16 - Evpatoria;NIP 14 - Shchelkovo;NIP 15 - Ussuriysk;NIP 6 - Vulkanny;NIP 4 - Yeniseisk
        %MSFN = MSFN - Ascension;MSFN - Antigua;MSFN - Bermuda;MSFN - Carnarvon;MSFN - Grand Bahama;MSFN - Grand Canary;MSFN - Grand Turk;MSFN - Guam;MSFN - Guaymas;MSFN - Kano;MSFN - Kauai;MSFN - Tananarive
        %NEN = ASF - Alaska Satellite Facility;SANSA - Hartebeesthoek;MGS - McMurdol;SSC - Santiago;KSAT - Singapore;KSAT - Svalbard;KSAT - TrollSat
        %ESTRACK = ESTRACK - Libreville;DSA 3 - Malargüe;ESTRACK - Malindi;ESTRACK - Natal;DSA 1 - New Norcia;ESTRACK - Redu;ESTRACK - Santa Maria
    }
}

//  ================================================================================
//  Configuration of ground stations antenna parameters.
//  ================================================================================

@Kopernicus:AFTER[RealSolarSystem]:NEEDS[RealAntennas]
{
    @Body[Earth]
    {
        @PQS
        {
            @Mods
            {
                // Every station gets a basic L-band omni for launch tracking and control.

                @City2[*_TrackingStation],*
                {
                    @commnetStation = false
                    %RACommNetStation = true
                    %icon = RealAntennas/radio-antenna

                    Antenna
                    {
                        referenceGain = 1.5
                        referenceFrequency = 1620
                        TxPower = 40
                        TechLevel = 9
                        RFBand = L
                        AMWTemp = 290
                        ModulationBits = 1
                    }
                }

                // DSA and NIP stations get upgraded with weak S-band dishes.

                @City2[*_DSA_TrackingStation],*
                {
                    %icon = RealAntennas/DSN

                    Antenna
                    {
                        referenceGain = 25
                        referenceFrequency = 2250
                        TxPower = 50
                        TechLevel = 9
                        RFBand = S
                        AMWTemp = 20
                        ModulationBits = 1
                    }
                }

                @City2[*_NIP_TrackingStation],*
                {
                    %icon = RealAntennas/DSN

                    Antenna
                    {
                        referenceGain = 25
                        referenceFrequency = 2250
                        TxPower = 50
                        TechLevel = 9
                        RFBand = S
                        AMWTemp = 20
                        ModulationBits = 1
                    }
                }

                // DSN stations get upgraded with very strong transmitters on all
                // microwave frequency bands (S, X and K) and also receive a bonus
                // by simulating an array of multiple antennas.

                @City2[*_DSN_TrackingStation],*
                {
                    %icon = RealAntennas/DSN

                    @Antenna:HAS[#RFBand[L]],*
                    {
                        @referenceGain = 25
                        @referenceFrequency = 1620
                        @TxPower = 50
                    }

                    Antenna
                    {
                        referenceGain = 65
                        referenceFrequency = 2250
                        TxPower = 60
                        TechLevel = 9
                        RFBand = S
                        AMWTemp = 20
                        ModulationBits = 1
                    }

                    Antenna
                    {
                        referenceGain = 75
                        referenceFrequency = 8450
                        TxPower = 70
                        TechLevel = 9
                        RFBand = X
                        AMWTemp = 15
                        ModulationBits = 2
                    }

                    Antenna
                    {
                        referenceGain = 85
                        referenceFrequency = 26250
                        TxPower = 50
                        TechLevel = 9
                        RFBand = K
                        AMWTemp = 10
                        ModulationBits = 2
                    }
                }
            }
        }
    }
}
