//  ================================================================================
//  Set custom time warping rates if neither BetterTimeWarp nor TimeControl are
//  installed as to not override their functionality.
//  ================================================================================

@REALSOLARSYSTEM:NEEDS[!BetterTimeWarpCont&!TimeControl]
{
    %timeWarpRates
    {
        %rate1 = 10
        %rate2 = 100
        %rate3 = 1000
        %rate4 = 10000
        %rate5 = 100000
        %rate6 = 1000000
        %rate7 = 6000000
    }
}
