//	============================================================================
//	Generic catchall for any parts that might contain a SCANsat module.
//	============================================================================

@PART:HAS[@MODULE[SCANsat]]:FOR[RealSolarSystem]
{
	// RADAR.

	@MODULE[SCANsat]:HAS[#sensorType[1]]
	{
		@min_alt = 10000
		@max_alt = 500000
		@best_alt = 10000
	}

	 // Synthetic Aperture RADAR.

	@MODULE[SCANsat]:HAS[#sensorType[2]]
	{
		@min_alt = 10000
		@max_alt = 8000000
		@best_alt = 7500000

		@RESOURCE[ElectricCharge]
		{
			@rate = 0.1
		}
	}

	// Biome scanner.

	@MODULE[SCANsat]:HAS[#sensorType[24]]
	{
		@min_alt = 10000
		@max_alt = 5000000
		@best_alt = 2500000

		@RESOURCE[ElectricCharge]
		{
			@rate = 0.2
		}
	}

	// Been There Done That.

	@MODULE[SCANsat]:HAS[#sensorType[32]]
	{
		@min_alt = 0
		@max_alt = 5000
		@best_alt = 0

		@RESOURCE[ElectricCharge]
		{
			@rate = 0.001
		}
	}
}

@PART:HAS[@MODULE[ModuleSCANresourceScanner]]:FOR[RealSolarSystem]
{
	@MODULE[ModuleSCANresourceScanner]
	{
		@min_alt *= 2
		@max_alt *= 10
		@best_alt *= 10

		@RESOURCE[ElectricCharge]
		{
			@rate /= 2
		}
	}
}

@COACH_COMMNET[CommNet]
{
	@MODULE[SCANsat]
	{
		@min_alt = 10000
		@max_alt = 5000000
		@best_alt = 2500000

		@RESOURCE[ElectricCharge]
		{
			@rate = 0.2
		}
	}
}
