//  ================================================================================
//  Add axial tilt to all solar system bodies.
//
//  The RA and DEC values were taken from the SPICE kernel constants pck00011:
//  https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
//
//  For bodies with unknown tilt RA is set to zero and DEC is set to 90 degrees.
//
//  NOTE:
//
//  The relative inclinations of some satellites are set incorrectly in RSS, being
//  referenced to the Earth's equator instead of their parent body. These inclination
//  values have been corrected here but they should be backported to RSS itself.
//  ================================================================================

@Kopernicus:AFTER[RealSolarSystem]:NEEDS[TiltEm]
{
    @Body[Ariel]
    {
        @Orbit
        {
            @inclination = 179.9664374456217
            %relativeToParent = true
        }

        @Properties
        {
            %tiltRelativeToParent = false
            %poleRA = 257.43
            %poleDec = -15.10
        }
    }

