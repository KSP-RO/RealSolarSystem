//  ================================================================================
//  Add axial tilt to all solar system bodies. Reference frame is ICRF instead of
//  FK4 but because all bodies use the parent body mean equator as the reference
//  plane no changes to the osculating orbital elements are needed.
//
//  The RA and DEC values were taken from the SPICE kernel constants pck00011:
//  https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
//
//  For bodies with unknown RA and DEC values these parameters are set to zero.
//
//  NOTE:
//
//  The relative inclinations of some satellites are set incorrectly in RSS, being
//  referenced to the ecliptic instead of the parent body. These inclination values
//  have been corrected here but they should be backported to RSS itself.
//  ================================================================================

@Kopernicus:AFTER[RealSolarSystem]:NEEDS[TiltEm]
{
    @Body[Ariel]
    {
        @Orbit
        {
            @inclination = 74.8989043025419
            %relativeToParent = true
        }

        @Properties
        {
            %tiltRelativeToParent = true
            %poleRA = 257.43
            %poleDec = -15.10
        }
    }

