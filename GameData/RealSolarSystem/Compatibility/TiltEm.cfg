//  ================================================================================
//  Add axial tilt to all solar system bodies. Reference frame is ICRS instead of
//  FK4 but because all bodies use the parent body mean equator as the reference
//  plane no changes to the osculating orbital elements are needed.
//  ================================================================================

@Kopernicus:FOR[RealSolarSystem]:NEEDS[TiltEm]
{
    @Body[Sun]
    {
        @Properties
        {
            %poleRA = 286.13
            %poleDec = 63.87
        }
    }

