//  ================================================================================
//  Add axial tilt to all solar system bodies.
//
//  Osculating orbital elements were exported using the JPL HORIZONS on-line solar
//  system data and ephemeris computation service:
//  https://ssd.jpl.nasa.gov/horizons
//
//  Settings used:
//
//      Ephemeris type:     Osculating Orbital Elements
//      Time start:         1951-01-01T00:00:00 (JD2433647.5000000)
//      Time end:           1951-01-01T12:00:00 (JD2433648.0000000)
//      Reference frame:    ICRF
//      Reference plane:    X-Y Axes of Reference Frame (equatorial or equatorial-aligned, inertial)
//
//  The pole RA and DEC values were taken from the SPICE kernel constants pck00011:
//  https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
//
//  Initial body rotation values were exported from Principia using the KMAT plugin.
//
//  For bodies with unknown reference angle the initial rotation is set to zero.
//  For bodies with unknown axial tilt RA is set to zero and DEC to 90 degrees.
//
//  FIXME: "Kerbin" should be renamed to "Earth" in the future.
//  ================================================================================

