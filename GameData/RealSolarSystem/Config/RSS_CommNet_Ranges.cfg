//  ================================================================================
//  Increase the connection range of the antennas to account for the x10 increase
//  in the distances between the planets.
//  ================================================================================

@PART:HAS[@MODULE[ModuleDataTransmitter]]:FOR[RealSolarSystem]
{
    @MODULE[ModuleDataTransmitter],*
    {
        @antennaPower *= 20

        @UPGRADES
        {
            @UPGRADE,*
            {
                @antennaPower *= 20
            }
        }
    }
}

//  ================================================================================
//  Do the same for the ground stations.
//  ================================================================================

@CUSTOMBARNKIT:FOR[RealSolarSystem]:NEEDS[CustomBarnKit]
{
    @TRACKING
    {
        @DSNRange = 5000000000, 500000000000, 50000000000000
    }
}
