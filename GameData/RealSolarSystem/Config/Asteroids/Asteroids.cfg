//  ================================================================================
//  Asteroid spawn positions.
//
//  Currently implemented:
//
//  - Generic Near Earth Objects (NEOs)
//  - Main asteroid belt (2 AU to 3.3 AU)
//  - Kuiper asteroid belt (30 AU to 60 AU)
//
//  Future additions:
//
//  - Generic Trojans, Centaurs and Comets
//
//  Sources:
//
//  Renu Malhotra, Xianyu Wang - Eccentricity distribution in the main asteroid belt: https://doi.org/10.1093/mnras/stw3009
//  AAS - The Plane of the Kuiper Belt: https://iopscience.iop.org/article/10.1086/382515/pdf
//
//  Notes:
//
//  - Maximum inclination values are representative of the more compact "core"
//    regions of the belts.
//  ================================================================================

@Kopernicus:BEFORE[RealSolarSystem]
{
    !Asteroid,*{}

    Asteroid
    {
        name = MainBeltAsteroids
        interval = 30               // How often to check and create asteroids, in seconds.
        probability = 33            // Percentage chance that an attempt is made to generate new asteroid for current interval.
        minUntrackedLifetime = 1    // Minimum number of days that the object will stay alive, unless tracked.
        maxUntrackedLifetime = 20   // Maximum number of days that the object will stay alive, unless tracked.
        spawnGroupMinLimit = 4      // Another randomization step applied when current count is between min and max. Lowers the success % the closer current count gets to max.
        spawnGroupMaxLimit = 4      // Max number of asteroid that can be spawned from this group.

        // When a spawn attempt is made the next location is randomly taken from the 3 possible types: Around, Nearby or Flyby.
        // If the rolled type isn't configured then nothing happens.
        // For some reason there's also a chance to roll type number 4 which also means that generation doesn't happen.

        Locations
        {
            Around
            {
                Body
                {
                    body = Sun
                    probability = 0.5
                    reached = false

                    semiMajorAxis
                    {
                        minValue = 300000000000
                        maxValue = 500000000000
                    }

                    eccentricity
                    {
                        minValue = 0
                        maxValue = 0.4
                    }

                    inclination
                    {
                        minValue = 0
                        maxValue = 20
                    }

                    longitudeOfAscendingNode
                    {
                        minValue = 0
                        maxValue = 360
                    }

                    argumentOfPeriapsis
                    {
                        minValue = 0
                        maxValue = 360
                    }

                    meanAnomalyAtEpoch
                    {
                        minValue = 0
                        maxValue = 360
                    }
                }
            }
        }
    }

    Asteroid
    {
        name = EarthFlybyAsteroids
        interval = 30
        probability = 15
        minUntrackedLifetime = 1
        maxUntrackedLifetime = 20
        spawnGroupMinLimit = 1
        spawnGroupMaxLimit = 3

        Locations
        {
            Flyby
            {
                Body
                {
                    body = Earth
                    probability = 1
                    minDuration = 15
                    maxDuration = 60
                    reached = false
                }
            }
        }
    }

    Asteroid
    {
        name = KuiperBeltAsteroids
        interval = 30
        probability = 33
        minUntrackedLifetime = 1
        maxUntrackedLifetime = 20
        spawnGroupMinLimit = 4
        spawnGroupMaxLimit = 6

        Locations
        {
            Around
            {
                Body
                {
                    body = Sun
                    probability = 0.5
                    reached = false

                    semiMajorAxis
                    {
                        minValue = 4500000000000
                        maxValue = 9000000000000
                    }

                    eccentricity
                    {
                        minValue = 0
                        maxValue = 0.4
                    }

                    inclination
                    {
                        minValue = 0
                        maxValue = 15
                    }

                    longitudeOfAscendingNode
                    {
                        minValue = 0
                        maxValue = 360
                    }

                    argumentOfPeriapsis
                    {
                        minValue = 0
                        maxValue = 360
                    }

                    meanAnomalyAtEpoch
                    {
                        minValue = 0
                        maxValue = 360
                    }
                }
            }
        }
    }

    // All groups have same sizes.

    @Asteroid,*
    {
        Size
        {
            key = 0   0
            key = 0.3 0.45
            key = 0.7 0.55
            key = 1   1
        }
    }
}

//  ================================================================================
//  Asteroid properties.
//
//  Sources:
//
//  LPI - Asteroid Density, Porosity & Structure: https://www.lpi.usra.edu/books/AsteroidsIII/pdf/3022.pdf
//
//  Notes:
//
//  - Density is defined as the average density of both the three main material
//    categories (clays, silicates and nickel-iron) compared to the average bulk
//    density of some well-known asteroids.
//  ================================================================================

@PART:HAS[@MODULE[ModuleAsteroid]]:BEFORE[RealSolarSystem]
{
    @MODULE[ModuleAsteroid]
    {
        @density = 3.3456
        @secondaryRate = 0.001
        %minRadiusMultiplier = 10.0
        %maxRadiusMultiplier = 100.0
    }
}
