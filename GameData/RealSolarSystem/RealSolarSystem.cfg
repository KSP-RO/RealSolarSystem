//  ==================================================
//  Custom settings for RealSolarSystem.
//  ==================================================

REALSOLARSYSTEM
{
	overrideCommNetParams = True

	ClipPlanes
	{
		// The far clip of the terrain camera is extended to cover the farthest
		// visible terrain: (horizon distance + distance to the highest terrain
		// behind the horizon) * farClipHorizonMult. It never goes below the
		// configured far clip. maxFarClip caps it when set.
		DX11
		{
			cam00FarClip = 750000
			dynamicFarClip = true
			farClipHorizonMult = 1.2
		}
		Other
		{
			cam01FarClip = 750000
			dynamicFarClip = true
			farClipHorizonMult = 1.2
		}
	}
  
  RSSRUNWAYFIX
	{
		debug = false
		holdThreshold = 2700
	}
}
